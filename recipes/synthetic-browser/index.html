<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synthetic viewer help check</title><link rel="stylesheet" href="/harness.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#edf3f0;color:#16332d;font:15px/1.4 system-ui,sans-serif}
#root{min-height:100dvh;display:flex;flex-direction:column;gap:10px;padding:12px}
header,footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}p{margin:0}nav{display:flex;gap:8px;flex-wrap:wrap}
button{padding:5px 10px}button:focus-visible{outline:3px solid #16c6b2;outline-offset:2px}
main{flex:1;min-height:0;display:flex}#fixture{display:flex;flex:1;min-width:0;min-height:0;height:calc(100dvh - 132px)}
.atlas-runtime-frame{position:relative;flex:1;min-width:0;min-height:280px;--atlas-learning-row:36px;background:#dce8e3}
.atlas-runtime-frame>.atlas-body-learning{position:absolute;z-index:2;bottom:0;left:0;right:0;width:100%;height:36px;background:#f8fbf6;border-top:1px solid #aec8c2}
.atlas-body-learning>summary{height:36px;padding:7px 12px;cursor:pointer}.atlas-body-learning>p{background:#f8fbf6;padding:8px 12px}
#instance{margin-inline-start:auto;font-size:13px}footer{min-height:32px}
@media(max-height:650px){#fixture{height:70dvh}}
</style><div id="root"></div><script type="module" src="/harness.js"></script></html>
