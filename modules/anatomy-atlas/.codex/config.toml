# Visible Medicine: project-scoped defaults; never changes account-wide settings.
# Existing task/composer overrides may take precedence.
model = "gpt-6-astra"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-6-sol"
default_subagent_reasoning_effort = "medium"
